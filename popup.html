<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .refresh-button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .refresh-button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .category {
      margin-bottom: 20px;
    }
    .source {
      color: #666;
      font-size: 0.8em;
    }
    .loading {
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>今日AI资讯</h1>
    <button id="refreshButton" class="refresh-button">刷新</button>
  </div>
  <div id="lastUpdate"></div>
  <div id="content"></div>
  <script src="popup.js"></script>
</body>
</html>
